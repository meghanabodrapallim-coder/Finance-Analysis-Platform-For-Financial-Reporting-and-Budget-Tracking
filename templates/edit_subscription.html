<!DOCTYPE html>
<html>
<head>
    <title>Smart Finance - Edit Subscription</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<nav>
    <span class="nav-brand">💰 Smart Finance Insights</span>
    <a href="/dashboard">Dashboard</a>
    <a href="/add_expense">Expenses</a>
    <a href="/budget">Budget</a>
    <a href="/investments">Investments</a>
    <a href="/goals">Goals</a>
    <a href="/wallets">Wallets</a>
    <a href="/bills">Bills & Calendar</a>
    <a href="/subscriptions">Subscriptions</a>
    <a href="/challenges">Challenges</a>
    <a href="/spending_personality">Spending Personality</a>
    <a href="/simulator">What-If Simulator</a>
    <a href="/analytics">Analytics</a>
    <a href="/ai_analysis">AI Analysis</a>
    <a href="/profile">Profile</a>
    <a href="/settings">Settings</a>

    <div class="nav-profile">
        <div class="profile-avatar">{{ session['user_name'][0] | upper }}</div>
        <div class="profile-info">
            <span class="profile-name">{{ session['user_name'] }}</span>
            <a href="/logout" class="profile-logout">Logout</a>
        </div>
    </div>
</nav>

<div class="container">
    <p class="page-title">Edit Subscription</p>

    <div class="card" style="max-width:500px;">
        <form method="POST" action="/edit_subscription/{{ sub.id }}">
            <label>Subscription Name</label>
            <input type="text" name="subscription_name" value="{{ sub.subscription_name }}" required>

            <label>Amount (₹)</label>
            <input type="number" name="amount" value="{{ sub.amount }}" required>

            <label>Billing Cycle</label>
            <select name="billing_cycle" required>
                <option value="Monthly" {% if sub.billing_cycle == 'Monthly' %}selected{% endif %}>Monthly</option>
                <option value="Yearly" {% if sub.billing_cycle == 'Yearly' %}selected{% endif %}>Yearly</option>
            </select>

            <label>Next Billing Date</label>
            <input type="date" name="next_billing_date" value="{{ sub.next_billing_date }}" required>

            <label>Category</label>
            <select name="category" required>
                {% for c in ['Streaming','Music','Shopping','Software','Other'] %}
                <option value="{{ c }}" {% if sub.category == c %}selected{% endif %}>{{ c }}</option>
                {% endfor %}
            </select>

            <button class="btn-orange" type="submit">Update Subscription</button>
        </form>
    </div>
</div>

</body>
</html>
