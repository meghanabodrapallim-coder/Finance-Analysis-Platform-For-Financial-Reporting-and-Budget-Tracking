<!DOCTYPE html>
<html>
<head>
    <title>Smart Finance Insights - Register</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <!-- Loading Spinner -->
<div id="loading-overlay">
    <div class="spinner"></div>
</div>

<div class="auth-container">
    <div class="auth-box">
        <div class="auth-header">
            <h1>💰 Smart Finance</h1>
            <p>Insights</p>
        </div>

        <h2>User Registration</h2>

        {% if error %}
        <div class="error-msg">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/register">
            <label>Full Name</label>
            <input type="text" name="name" 
                   placeholder="Pavithra S" required>

            <label>Email</label>
            <input type="email" name="email" 
                   placeholder="pavithra@example.com" required>

            <label>Password</label>
            <input type="password" name="password" 
                   placeholder="••••••••••" required>

            <label>Confirm Password</label>
            <input type="password" name="confirm_password" 
                   placeholder="••••••••••" required>

            <button class="btn-green" type="submit">Register</button>
        </form>

        <p style="text-align:center; margin-top:15px;">
            Already have an account? 
            <a href="/login">Login here</a>
        </p>
    </div>
</div>
<!-- Dark Mode Toggle -->
<button class="dark-toggle" 
        onclick="toggleDark()" 
        id="darkBtn">🌙</button>
<script>
// Loading Spinner
window.addEventListener('load', function() {
    document.getElementById('loading-overlay')
        .style.display = 'none';
});

// Dark Mode
function toggleDark() {
    document.body.classList.toggle('dark-mode');
    const btn = document.getElementById('darkBtn');
    if (document.body.classList.contains('dark-mode')) {
        btn.textContent = '☀️';
        localStorage.setItem('darkMode', 'on');
    } else {
        btn.textContent = '🌙';
        localStorage.setItem('darkMode', 'off');
    }
}

// Remember dark mode on reload
if (localStorage.getItem('darkMode') === 'on') {
    document.body.classList.add('dark-mode');
    document.getElementById('darkBtn').textContent = '☀️';
}

// Animated Number Counters
function animateCounter(element, target, prefix) {
    let start = 0;
    const duration = 1500;
    const step = target / (duration / 16);
    const timer = setInterval(function() {
        start += step;
        if (start >= target) {
            start = target;
            clearInterval(timer);
        }
        element.textContent = prefix +
            Math.floor(start).toLocaleString('en-IN');
    }, 16);
}

window.addEventListener('load', function() {
    document.querySelectorAll('.stat-card p')
        .forEach(function(el) {
            const text = el.textContent.trim();
            if (text.startsWith('₹')) {
                const num = parseFloat(
                    text.replace('₹','').replace(/,/g,'')
                );
                if (!isNaN(num)) {
                    animateCounter(el, num, '₹');
                }
            } else if (text.endsWith('%')) {
                const num = parseFloat(text.replace('%',''));
                if (!isNaN(num)) {
                    const timer = setInterval(function() {
                        // handled separately
                    }, 16);
                }
            }
        });
});
</script>
</body>
</html>
